<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- Avion StayNdiscover vu du dessus (même modèle que le logo : aile haute, couleur turquoise du logo). Nez vers la droite. -->
  <defs>
    <linearGradient id="fus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b6f7c"/><stop offset=".3" stop-color="#22b3c4"/><stop offset=".46" stop-color="#8fe3ec"/>
      <stop offset=".6" stop-color="#1fa9ba"/><stop offset="1" stop-color="#0a6774"/>
    </linearGradient>
    <linearGradient id="wing" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5fd0dc"/><stop offset=".25" stop-color="#2bb8c8"/><stop offset="1" stop-color="#0f8796"/>
    </linearGradient>
    <linearGradient id="span" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".2" stop-color="#000" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#3cc2d0"/><stop offset="1" stop-color="#0e8090"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe9ef"/><stop offset=".35" stop-color="#3d6f7e"/><stop offset="1" stop-color="#16303a"/>
    </linearGradient>
    <radialGradient id="spin" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd8da"/><stop offset="1" stop-color="#6d7b7e"/>
    </radialGradient>
  </defs>
  <!-- empennage horizontal -->
  <path d="M46 158 L82 165 Q88 167 88 174 L88 266 Q88 273 82 275 L46 282 Q38 282 39 272 L41 168 Q40 158 46 158 Z" fill="url(#tail)"/>
  <path d="M58 164 L58 276" stroke="#0a5f6b" stroke-width="1.6" opacity=".55"/>
  <path d="M46 158 L82 165 Q88 167 88 174 L88 266 Q88 273 82 275 L46 282" fill="none" stroke="#9be6ee" stroke-width="1.4" opacity=".6"/>
  <!-- fuselage -->
  <path d="M386 220 C386 205 377 198 362 197 L300 193 C262 193 226 197 200 201 L96 209 L44 213 Q33 220 44 227 L96 231 L200 239 C226 243 262 247 300 247 L362 243 C377 242 386 235 386 220 Z" fill="url(#fus)"/>
  <!-- dérive (vue de dessus : fine arête) -->
  <path d="M30 220 L100 220" stroke="#0a5a65" stroke-width="5" stroke-linecap="round"/>
  <path d="M34 218.6 L98 218.6" stroke="#7fdbe6" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <!-- vitre arrière -->
  <path d="M232 209 Q246 205 258 205 L258 235 Q246 235 232 231 Q228 220 232 209 Z" fill="url(#glass)" opacity=".95"/>
  <!-- aile haute -->
  <path d="M266 24 Q262 14 272 13 L314 13 Q326 14 323 26 L323 414 Q326 426 314 427 L272 427 Q262 426 266 416 Z" fill="url(#wing)"/>
  <path d="M266 24 Q262 14 272 13 L314 13 Q326 14 323 26 L323 414 Q326 426 314 427 L272 427 Q262 426 266 416 Z" fill="url(#span)"/>
  <path d="M272 13 L314 13 Q326 14 323 26 L323 414 Q326 426 314 427" fill="none" stroke="#a8eef4" stroke-width="1.6" opacity=".7"/>
  <!-- ailerons et volets -->
  <path d="M280 30 L280 150 M280 290 L280 410" stroke="#0a5f6b" stroke-width="1.6" opacity=".6"/>
  <path d="M266 150 L280 150 M266 290 L280 290 M266 30 L280 30 M266 410 L280 410" stroke="#0a5f6b" stroke-width="1.3" opacity=".5"/>
  <!-- feux de bout d'aile -->
  <circle cx="300" cy="17" r="3" fill="#e5533d"/><circle cx="300" cy="423" r="3" fill="#2fbf71"/>
  <!-- pare-brise -->
  <path d="M323 203 Q338 205 346 211 Q350 220 346 229 Q338 235 323 237 Z" fill="url(#glass)"/>
  <path d="M327 207 Q336 209 341 213" stroke="#ffffff" stroke-width="1.6" fill="none" opacity=".8" stroke-linecap="round"/>
  <!-- capot moteur -->
  <path d="M352 200 Q372 203 380 211" stroke="#0a5f6b" stroke-width="1.2" fill="none" opacity=".5"/>
  <path d="M352 240 Q372 237 380 229" stroke="#0a5f6b" stroke-width="1.2" fill="none" opacity=".5"/>
  <!-- cône d'hélice -->
  <ellipse cx="389" cy="220" rx="7" ry="9" fill="url(#spin)"/>
</svg>
